name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Build and Test
      run: |
        dotnet restore AiGateway.sln --locked-mode
        dotnet build --configuration Release --no-restore /p:TreatWarningsAsErrors=true
        # Clear proxy environment variables to ensure deterministic test results
        $env:HTTP_PROXY = ''
        $env:HTTPS_PROXY = ''
        dotnet test --configuration Release --no-build --verbosity normal

    - name: Publish (optional)
      run: |
        dotnet publish src/AiGateway.App/AiGateway.App.csproj --configuration Release --output ./publish -f net8.0-windows
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
